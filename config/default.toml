[[security.signatures]]
category = "admin"
severity = "medium"
reason = "security.reason.admin"
keywords = ["admin", "administrator", "wp-admin", "wp-login.php", "cpanel", "whm", "phpmyadmin", "pma", "adminer", "adminer.php", "manager", "console", "controlpanel", "control-panel", "cms", "backend", "back-office", "backoffice", "panel", "umbraco", "typo3", "user/login", "wp-login"]

[[security.signatures]]
category = "staging"
severity = "medium"
reason = "security.reason.staging"
keywords = ["staging", "stage", "stg", "dev", "develop", "development", "test", "testing", "tests", "qa", "uat", "beta", "alpha", "sandbox", "preprod", "pre-prod", "preview", "demo", "old", "old-site", "new-site", "tmp", "temp"]

[[security.signatures]]
category = "staging"
severity = "low"
reason = "security.reason.versioned"
# Only a leading version segment, or one right after /api/: "v1" deeper in a
# path is a platform's own widget route, not a staging copy.
pattern = '^/(?:api/)?v[0-9]+(?:/|$|\*|\.)'

[[security.signatures]]
category = "secrets"
severity = "high"
reason = "security.reason.configFile"
pattern = '(?:^|/)(?:\.env[a-z0-9_.-]*|\.git|\.svn|\.hg|\.htaccess|\.htpasswd|\.aws|\.ssh|\.docker|\.idea|\.vscode|wp-config\.php|config\.php|configuration\.php|settings\.py|appsettings\.json|web\.config|\.ds_store|id_rsa|composer\.json|package\.json)(?:/|$|\*|\.)'

[[security.signatures]]
category = "secrets"
