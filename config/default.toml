# ---------------------------------------------------------------- recon: comments
# These parse the comment text itself (English keywords stay English).
[recon.comments]
email = '(?i)[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}'
person = '(?i)\b(?:updated|maintained|created|edited|modified|written|managed|owned|added|reviewed|approved|generated|last (?:updated|edited|modified|changed))\s+by[:\s]+([^\n,.;(#]{2,60}?)(?=\s+(?:on|at|for|in|via|-|–|\d)|[,.;(]|$)'
person_deny = '(?i)^(?:the|a|an|our|this|automatic|automatically|script|bot|tool|system)\b'
jira = '\b([A-Z][A-Z0-9]{1,9}-\d{1,6})\b'
jira_deny = '^(?:UTF|ISO|RFC|HTTP|HTTPS|SHA|MD|AES|TLS|SSL|IPV|RSS|XML|HTML|CSS|JSON|API|ID|URL|OS|GPT|ECMA|IEEE|OAUTH|PCI|DSS|ES|X|WIN|MAC|IE|COVID|GDPR|SOC|OWASP|CVE|CWE|UUID|GUID|HEX|B|KB|MB|GB|TB|GMT|UTC|CET|EST|PST|US|EU|UK|CA|DE|FR|NL|BE|W|H)-'
ticket_word = '(?i)\b(?:ticket|issue|bug|task|case|story|epic|incident|inc|change|cr|pr|mr)\s*(?:#|no\.?|number)?\s*(\d{2,7})\b'
iso_date = '\b(20\d{2})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])\b'
slash_date = '(?<![\d.])(\d{1,2})[/.](\d{1,2})[/.]((?:19|20)?\d{2})(?![\d.])'
