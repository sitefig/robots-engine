# Default rules for the susbot robots.txt engine (sus.bot).
#
# Every check, crawler and signature the engine knows about lives in this
# file. A user config (`--config my.toml` on the CLI, or pasted in the
# browser's Rules panel) is merged on top: scalar values and tables override,
# arrays replace the default array wholesale. To extend a list, copy it from
# here and add to it. Regular expressions use Rust `fancy-regex` syntax
# (JavaScript-like, lookaround supported); prefix with (?i) for
# case-insensitive matching.
#
# Text values that look like dictionary keys (security.reason.admin) are
# translated through the locale; anything else is shown as written, so custom
# entries can carry plain text.

[tool]
name = "sus.bot"
vendor = "Sitefig"
url = "https://sus.bot"

# ---------------------------------------------------------------- rules
# Any finding can be silenced by id, or given another level.
[rules]
disabled = []            # e.g. ["seo.caseSensitive", "parser.noSitemap"]

[rules.levels]           # id = "error" | "warning" | "info"
# "seo.trailingSlash" = "info"

# ---------------------------------------------------------------- checks
[checks]
seo_traps = true         # trailing-slash trap, self-block, case notes, shadowed rules
sitemaps = true          # protocol, cross-domain, duplicate sitemap lines
absolute_urls = true     # Allow/Disallow with an absolute URL
security = true          # sensitive Disallow paths

[checks.recon]
cms = true
generators = true         # the tool that wrote the file, from its comment
cloud = true
hosts = true
api = true
data = true
extensions = true
comments = true

# ---------------------------------------------------------------- crawlers
[crawlers]
categories = ["search", "ai-training", "ai-search", "ai-scraper", "social", "seo", "ads", "archive", "marketing", "scraper", "retired"]
ai_categories = ["ai-training", "ai-search"]   # first one is the "AI training" group of the status card
browser_ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
# What we send when we fetch a robots.txt on our own account (the census
# crawl and the tracking runs). It names itself and links the page that
# explains it, as a crawler should; see src/site/bot.md.
bot_ua = "Mozilla/5.0 (compatible; susbot/2.2; +https://sus.bot/bot/)"

# Offline downloaders and e-mail harvesters from 1990s block lists. None of
# them read robots.txt; a file naming ten or more is copied boilerplate.
legacy_tokens = [
  "alexibot", "asterias", "backdoorbot", "black hole", "blackwidow", "blowfish", "botalot", "builtbottough", "bullseye", "bunnyslippers", "cheesebot",
  "cherrypicker", "cherrypickerelite", "cherrypickerse", "chinaclaw", "copyrightcheck", "cosmos", "crescent", "custo", "dittospyder",
  "download ninja", "ecatch", "eirgrabber", "emailcollector", "emailsiphon", "emailwolf", "erocrawler", "extractorpro", "eyenetie",
  "flaming attackbot", "flashget", "foobot", "getright", "go!zilla", "go-ahead-got-it", "grabnet", "grafula", "harvest", "hloader", "hmview",
  "httrack", "humanlinks", "infonavirobot", "interget", "iron33", "jennybot", "jetcar", "kenjin spider", "keyword density", "larbin", "leechftp",
  "lexibot", "libweb", "linkextractorpro", "linkscan", "linkwalker", "lwp-trivial", "mata hari", "microsoft url control", "microsoft.url.control",
  "miixpc", "mister pix", "moget", "msiecrawler", "navroad", "nearsite", "netants", "netmechanic", "netspider", "netzip", "nicerspro", "npbot",
  "obot", "octopus", "offline explorer", "openbot", "openfind", "pagegrabber", "pavuk", "pcbrowser", "propowerbot", "prowebwalker", "psbot",
  "queryn metasearch", "radiation retriever 1.1", "realdownload", "reget", "repomonkey", "robozilla", "sitesnagger", "smartdownload", "spankbot",
  "spanner", "superhttp", "suzuran", "szukacz", "takeout", "teleport", "teleportpro", "telesoft", "the intraformant", "thenomad", "titan", "tocrawl",
  "true_robot", "turingos", "url control", "url_spider_pro", "urly warning", "vci", "voideye", "web image collector", "webauto", "webbandit",
  "webcopier", "webenhancer", "webfetch", "webleacher", "webreaper", "websauger", "website quester", "webster pro", "webstripper", "webwhacker",
  "webzip", "widow", "www-collector-e", "wwwoffle", "xenu", "xenu's", "zeus", "zeus link scout", "zyborg",
]

