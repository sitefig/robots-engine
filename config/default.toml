# ---------------------------------------------------------------- recon: other hosts and environments
[recon.hosts]
env_labels = '^(?:staging|stage|stg|dev|devel|develop|development|test|testing|tst|qa|uat|beta|alpha|preprod|pre-prod|preview|sandbox|demo|internal|intranet|corp|vpn|admin|api|cdn|static|assets|media|img|images|old|new|legacy|next|canary|labs?|preview-\w+|\w+-staging|\w+-dev|\w+-test|dev-\w+|staging-\w+|test-\w+|old-\w+|new-\w+|legacy-\w+|v\d+)$'
env_label_fallback = 'staging|dev|test|beta|uat|sandbox|preprod'
env_paths = '^(?:staging|stage|stg|dev|test|testing|qa|uat|beta|alpha|preprod|preview|sandbox|demo|old|old-site|oldsite|new|new-site|newsite|redesign|relaunch|rebrand|legacy|archive|v\d+-[a-z0-9-]+|\d{4}-site|site-\d{4}|next|migration|temp|tmp)$'
env_path_hint = 'redesign|relaunch|new-site|old-site|staging'

# ---------------------------------------------------------------- recon: API endpoints (first match wins)
[recon.api]

[[recon.api.signatures]]
kind = "graphql"
pattern = '(^|/)(graphql|graphiql|altair|voyager|graphql-playground|playground)(/|$|\?)'

[[recon.api.signatures]]
kind = "docs"
pattern = '(^|/)(swagger[^/]*|openapi[^/]*|api-docs|apidocs|api_docs|redoc|rapidoc|scalar|docs/api|api/docs|api/documentation|__schema|schema\.json|wsdl|[^/]+\.wsdl)(/|$|\?)'

[[recon.api.signatures]]
kind = "ops"
pattern = '(^|/)(actuator|health|healthz|healthcheck|ready|readyz|livez|metrics|prometheus|status|server-status|server-info|debug|_debug|__debug__|_profiler|telescope|horizon|phpinfo(\.php)?|env|info|trace|elmah\.axd|nginx_status)(/|$|\?)'

[[recon.api.signatures]]
kind = "rpc"
pattern = '(^|/)(rpc|jsonrpc|json-rpc|xmlrpc(\.php)?|soap|ws|wss|websocket|socket\.io|sockjs|signalr|hub|hubs|cable|realtime|pubsub|sse|events|stream)(/|$|\?)'

[[recon.api.signatures]]
kind = "gateway"
pattern = '(^|/)(api|apis|_api|api-internal|internal-api|rest|restapi|rest-api|services?|webservices?|gateway|endpoints?|webhooks?|oauth2?|auth|token|v\d+|ajax|_ajax|ajax-api|odata|feed-api|graph)(/|$|\?)'

# ---------------------------------------------------------------- recon: data feeds, portals and search
[recon.data]
feed_words = '^(?:feed|feeds|rss|atom|export|exports|dump|dumps|report|reports|reporting|inventory|stock|stocks|pricelist|price-list|prices|pricing|catalog\.xml|catalogue\.xml|products\.json|products\.xml|collections\.json|merchant|google-merchant|shopping-feed|shoppingfeed|datafeed|data-feed|datafeeds|feed\.xml|feed\.json|sitemap-products\.xml|bulk|bulk-export|download-all|api-export)$'
feed_file = '\.(?:csv|tsv|xlsx?|json|xml|ndjson|parquet)\$?$'
feed_hint = 'feed|export|inventory|merchant|pricelist|price-list|catalog|report|dump'
feed_file_wildcard = '\*\.(?:csv|tsv|xlsx?)\$?$'
portal_words = '^(?:partner|partners|partner-[a-z0-9-]+|wholesale|wholesaler|wholesalers|vip|vip-[a-z0-9-]+|affiliate|affiliates|influencer|influencers|influencer-[a-z0-9-]+|reseller|resellers|dealer|dealers|distributor|distributors|trade|trade-only|b2b|employee|employees|staff|staff-only|intranet|press|press-kit|presskit|media-kit|investor|investors|ir|members-only|member-only|exclusive|discount|discounts|promo|promos|coupon|coupons|voucher|vouchers|preorder|pre-order|early-access|earlyaccess|insider|insiders|loyalty|rewards|ambassador|ambassadors|creator|creators|corporate|enterprise|friends-and-family|friends-family|secret-sale|private-sale|flash-sale|outlet|clearance|beta-program)$'
search_segments = '^(?:search|searches|catalogsearch|suche|recherche|buscar|busqueda|zoeken|cerca|ricerca|szukaj|sok|haku|find|results|search-results|searchresults|s|q)$'
search_keys = ["s", "q", "query", "search", "searchterm", "search_term", "search-term", "keyword", "keywords", "term", "k", "srch", "text", "find", "kw", "searchtext", "search_query", "searchquery", "sq", "qs"]
filter_keys = ["filter", "filters", "sort", "sort_by", "sortby", "order", "orderby", "order_by", "orderway", "dir", "direction", "limit", "per_page", "page", "p", "pagenum", "start", "offset", "view", "mode", "layout", "display", "color", "colour", "size", "price", "min_price", "max_price", "brand", "category", "cat", "tag", "tags", "rating", "instock", "availability"]
feed_fallback = "recon.data.feed.file"      # label when no feed_kinds pattern matches
portal_fallback = "recon.data.portal.other"  # label when no portal_kinds pattern matches
tracking_keys = '^(?:utm_|gclid|fbclid|msclkid|dclid|mc_|ref$|referrer$|affiliate|aff_|campaign|source$|medium$|sessionid|sid$|phpsessid|jsessionid|cid$|clickid)'

# Feed and portal descriptions: first matching pattern wins; `label` is a dictionary key or plain text.
[[recon.data.feed_kinds]]
pattern = 'merchant|shopping-feed|google'
label = "recon.data.feed.merchant"
[[recon.data.feed_kinds]]
pattern = 'inventory|stock'
label = "recon.data.feed.inventory"
[[recon.data.feed_kinds]]
pattern = 'price'
label = "recon.data.feed.prices"
[[recon.data.feed_kinds]]
