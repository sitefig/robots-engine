[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm", "crates/cli"]
# The `susbot` crate only claims the short name on crates.io and installs the
# same binary as susbot-cli; it has its own workspace so the two binaries
# named `susbot` never build into the same target directory.
exclude = ["crates/susbot"]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/sitefig/robots-engine"
homepage = "https://sus.bot/"
authors = ["Sitefig <https://sitefig.eu/>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
basic-toml = "0.1"
regex = { version = "1", default-features = false, features = ["std", "perf-inline", "unicode-perl", "unicode-case"] }
url = "2"
# Pin the small unicode-rs IDNA backend; the ICU4X one adds ~700 KB to the WASM bundle.
idna_adapter = "=1.1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
