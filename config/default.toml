# ---------------------------------------------------------------- recon: cloud hosts
# host: regex against the lowercased hostname. bucket: how to extract the
# bucket/account name, alternatives separated by "|" (first non-empty wins):
#   host:N      capture group N of the host regex
#   segment:N   Nth path segment (1-based)
#   path:REGEX  capture group 1 of REGEX matched against the path
#   a + b       both, joined with " / "
[recon.cloud]

[[recon.cloud.providers]]
provider = "AWS S3"
kind = "storage"
host = '^(?:([a-z0-9.-]+)\.)?s3(?:[.-](?:website[.-])?[a-z0-9-]+)?(?:\.dualstack)?\.amazonaws\.com$'
bucket = "host:1|segment:1"

[[recon.cloud.providers]]
provider = "Amazon CloudFront"
kind = "cdn"
host = '^([a-z0-9]+)\.cloudfront\.net$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Google Cloud Storage"
kind = "storage"
host = '^storage\.(?:googleapis|cloud\.google)\.com$'
bucket = "segment:1"

[[recon.cloud.providers]]
provider = "Google Cloud Storage"
kind = "storage"
host = '^([a-z0-9._-]+)\.storage\.googleapis\.com$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Firebase Hosting"
kind = "hosting"
host = '^([a-z0-9-]+)\.(?:web\.app|firebaseapp\.com)$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Azure Blob Storage"
kind = "storage"
host = '^([a-z0-9]+)\.blob\.core\.windows\.net$'
bucket = "host:1 + segment:1"

[[recon.cloud.providers]]
provider = "Azure App Service"
kind = "hosting"
host = '^([a-z0-9-]+)\.azurewebsites\.net$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Azure Static Web Apps"
kind = "hosting"
host = '^([a-z0-9-]+)\.azurestaticapps\.net$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Azure CDN / Front Door"
kind = "cdn"
host = '^([a-z0-9-]+)\.(?:azureedge|azurefd)\.net$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "DigitalOcean Spaces"
kind = "storage"
host = '^(?:([a-z0-9.-]+)\.)?([a-z0-9]+)\.(?:cdn\.)?digitaloceanspaces\.com$'
bucket = "host:1|segment:1"

[[recon.cloud.providers]]
provider = "Backblaze B2"
kind = "storage"
host = '^(?:f\d+|s3\.[a-z0-9-]+|[a-z0-9.-]+\.s3\.[a-z0-9-]+)\.backblazeb2\.com$'
bucket = "path:^/file/([^/]+)|segment:1"

[[recon.cloud.providers]]
provider = "Cloudflare R2"
kind = "storage"
host = '^(?:([a-z0-9-]+)\.)?(?:r2\.dev|r2\.cloudflarestorage\.com)$'
bucket = "host:1|segment:1"

[[recon.cloud.providers]]
provider = "Cloudflare Pages"
kind = "hosting"
host = '^([a-z0-9-]+)\.pages\.dev$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Wasabi"
kind = "storage"
host = '^(?:([a-z0-9.-]+)\.)?s3(?:\.[a-z0-9-]+)?\.wasabisys\.com$'
bucket = "host:1|segment:1"

[[recon.cloud.providers]]
provider = "Linode Object Storage"
kind = "storage"
host = '^(?:([a-z0-9.-]+)\.)?[a-z0-9-]+\.linodeobjects\.com$'
bucket = "host:1|segment:1"

[[recon.cloud.providers]]
provider = "Alibaba Cloud OSS"
kind = "storage"
host = '^(?:([a-z0-9-]+)\.)?oss-[a-z0-9-]+(?:-internal)?\.aliyuncs\.com$'
bucket = "host:1|segment:1"

[[recon.cloud.providers]]
provider = "Oracle Object Storage"
kind = "storage"
host = '^objectstorage\.[a-z0-9-]+\.oraclecloud\.com$'
bucket = "path:/b/([^/]+)"

[[recon.cloud.providers]]
provider = "Supabase Storage"
kind = "storage"
host = '^([a-z0-9]+)\.supabase\.co$'
bucket = "path:/object/[^/]+/([^/]+)|host:1"

[[recon.cloud.providers]]
provider = "Vercel Blob"
kind = "storage"
host = '^([a-z0-9]+)\.public\.blob\.vercel-storage\.com$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Vercel"
kind = "hosting"
host = '^([a-z0-9-]+)\.vercel\.app$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Netlify"
kind = "hosting"
host = '^([a-z0-9-]+)\.netlify\.(?:app|com)$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "GitHub Pages"
kind = "hosting"
host = '^([a-z0-9-]+)\.github\.io$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "GitHub raw content"
kind = "hosting"
host = '^raw\.githubusercontent\.com$'
bucket = "path:^/([^/]+/[^/]+)"

[[recon.cloud.providers]]
provider = "Heroku"
kind = "hosting"
host = '^([a-z0-9-]+)\.herokuapp\.com$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Render"
kind = "hosting"
host = '^([a-z0-9-]+)\.onrender\.com$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Fly.io"
kind = "hosting"
host = '^([a-z0-9-]+)\.fly\.dev$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Fastly"
kind = "cdn"
host = '^([a-z0-9.-]+)\.(?:global\.(?:ssl|prod)\.)?fastly\.net$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Akamai"
kind = "cdn"
host = '^([a-z0-9.-]+)\.(?:akamaihd|akamaized|edgekey|edgesuite)\.net$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Cloudinary"
kind = "cdn"
host = '^res\.cloudinary\.com$'
bucket = "segment:1"

[[recon.cloud.providers]]
provider = "imgix"
kind = "cdn"
host = '^([a-z0-9-]+)\.imgix\.net$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "KeyCDN"
kind = "cdn"
host = '^([a-z0-9-]+)\.kxcdn\.com$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Bunny CDN"
kind = "cdn"
host = '^([a-z0-9-]+)\.b-cdn\.net$'
bucket = "host:1"

[[recon.cloud.providers]]
provider = "Shopify CDN"
kind = "platform"
host = '^cdn\.shopify\.com$'
bucket = 'path:/s/files/1/(\d+/\d+/\d+)'

[[recon.cloud.providers]]
provider = "Squarespace CDN"
kind = "platform"
host = '^(?:static\d*|images)\.squarespace(?:-cdn)?\.com$'
