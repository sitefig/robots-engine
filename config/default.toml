# findings-spec-CC-MAIN-2026-34.md, section B6: Platform fingerprints (recon.cms) to add
#
# kind judgement calls (platform_kinds in default.toml is
# ["cms", "ecommerce", "hosting", "forum", "wiki"], the kinds eligible to be
# picked as the "primary" platform):
# - Tilda and CM4all are hosted site builders (like Wix/Squarespace/Weebly in
#   the existing config), so they keep kind = "hosting".
# - Shopware and Tiendanube/Nuvemshop are storefront platforms, kind = "ecommerce".
# - EmpireCMS is a content-management system, kind = "cms".
# - HestiaCP/VestaCP is a hosting-control-panel default file and Cloudflare's
#   managed robots.txt is a proxy-injected notice: neither says anything about
#   the site's own platform, so both get kind = "backend" (already used in
#   default.toml for non-platform infrastructure signatures such as Laravel,
#   Django, Rails, ASP.NET, Spring Boot) rather than a platform_kinds value,
#   so they are never picked as the detected "primary" platform.

[[recon.cms.signatures]]
name = "Tilda"
kind = "hosting"
strong = ['^/tilda/']
weak = []
comments = ['tilda']

[[recon.cms.signatures]]
name = "Shopware"
kind = "ecommerce"
strong = ['^/widgets/', '^/checkout/']
weak = []
comments = ['shopware']

[[recon.cms.signatures]]
name = "CM4all"
kind = "hosting"
strong = ['^/\.cm4all/']
weak = []
comments = []

[[recon.cms.signatures]]
