# ---------------------------------------------------------------- recon: generators
# The tool that wrote the file, recognised by the comment it leaves.
# findings-spec-CC-MAIN-2026-34.md, section B7: Generators (comment fingerprints)
# worth a recon card. Regexes match the lowercased comment text; literal "."
# characters in the fingerprint (e.g. "robots.txt") are escaped as "\.".

[[recon.generators]]
name = "Yoast SEO"
comments = ['start yoast block']

[[recon.generators]]
name = "WPForms"
comments = ['start wpforms block']

[[recon.generators]]
name = "Wix SEO Tools"
comments = ['go to seo tools > robots\.txt editor']

[[recon.generators]]
