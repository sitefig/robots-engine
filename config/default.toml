severity = "medium"
reason = "security.reason.api"
keywords = ["api/internal", "api/private", "api/admin", "api/debug", "internal", "internal-api", "private-api", "debug", "_debug", "actuator", "swagger", "swagger-ui", "api-docs", "openapi", "graphql", "graphiql", "metrics", "phpinfo", "phpinfo.php", "server-status", "server-info", "trace", "elmah.axd", "_profiler", "telescope", "horizon", "__debug__"]
