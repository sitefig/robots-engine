[package]
name = "susbot-core"
description = "robots.txt analysis engine: parser, RFC 9309 matcher, lint checks, security and reconnaissance findings, exports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Tests read files from the repository (examples, schema), so they stay out of the package.
exclude = ["tests/"]
keywords = ["robots-txt", "crawler", "seo", "rfc9309", "parser"]
categories = ["parser-implementations", "web-programming"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
basic-toml.workspace = true
regex.workspace = true
fancy-regex = { version = "0.14", default-features = false, features = ["std"] }
url.workspace = true
idna_adapter.workspace = true

[dev-dependencies]
jsonschema = { version = "0.26", default-features = false }
