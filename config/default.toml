# ---------------------------------------------------------------- security
# Disallow paths that advertise sensitive locations. `keywords` match on
# path-segment boundaries (so /administration-guide does not hit "admin");
# `pattern` is a raw regex against the lowercased path with a trailing "$"
# removed. The highest severity signature wins per rule.
[security]
# Regexes; matching Disallow paths are not reported. These are platform
# defaults that every site on the platform publishes, so they disclose nothing.
ignore = [
  '(?:^|/)pro-gallery-webapp(?:/|$)',   # Wix platform default, on 2.9 million sites
  '^/cdn-cgi/',                          # Cloudflare infrastructure
  '^/\\.well-known/',                      # RFC 8615 well-known URIs
  '^/(?:index\\.php/|\\?q=)?user/password/?$',  # Drupal and Joomla password reset
]

