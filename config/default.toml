[[recon.generators]]
name = "PrestaShop"
comments = ['generated by prestashop']

[[recon.generators]]
name = "Virtual Robots.txt (WP plugin)"
comments = ['virtual robots\.txt']

[[recon.generators]]
name = "nuxt-robots"
comments = ['nuxt-robots']

[[recon.generators]]
