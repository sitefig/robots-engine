[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "susbot"
dynamic = ["version"]
description = "robots.txt checker: which search engines and AI crawlers a site lets in, lint findings, exposed paths and diffs (sus.bot). Python bindings and the susbot command."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Sitefig" }]
keywords = ["robots.txt", "crawler", "seo", "ai", "gptbot", "rfc9309", "audit"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://sus.bot/"
Source = "https://github.com/sitefig/robots"
Issues = "https://github.com/sitefig/robots/issues"

[project.scripts]
susbot = "susbot.__main__:main"

[tool.maturin]
python-source = "python"
module-name = "susbot._susbot"
features = ["extension-module"]
