kind = "ecommerce"
strong = []
weak = []
comments = ['tiendanube', 'nuvemshop']

[[recon.cms.signatures]]
name = "EmpireCMS"
kind = "cms"
strong = []
weak = []
comments = ['robots\.txt for empirecms']

[[recon.cms.signatures]]
name = "HestiaCP / VestaCP"
